# Source-file modification times for reproducible RSS <updated> timestamps.
#
# rss.builder emits each entry's <updated> from File.mtime(article.source_file),
# but git/jj checkouts do not preserve mtimes (a fresh clone stamps every file
# with the checkout time). config.rb restores the mtimes below before a build so
# the generated feed is byte-for-byte reproducible and matches the published
# gh-pages feed. Only posts that appear in the feed window need an entry; add a
# line here (authored timestamp, RFC 3339 / ISO 8601) when publishing a new post.
